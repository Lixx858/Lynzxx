<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>FelixDeploy</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="intro" class="intro">
  <div class="intro-logo"><span>FELIXD</span><b>EPLOY</b></div>
  <div class="progress"><div id="progress"></div></div>
  <div class="intro-text">INITIALIZING DEPLOYMENT ENGINE<span id="dots">...</span></div>
</section>

<div id="app" hidden>
  <div class="grid"></div>
  <header>
    <div class="brand"><span>felix</span><b>Deploy</b></div>
    <nav>
      <button class="nav active" data-go="deploy">◦ DEPLOY</button>
      <button class="nav" data-go="projects">◦ PROJECTS</button>
    </nav>
  </header>

  <main>
    <section class="panel" id="deploy">
      <div class="title"><i></i> DEPLOY BERKAS BARU</div>
      <label>NAMA PROJECT</label>
      <input id="name" value="felix-project" maxlength="50" autocomplete="off">

      <div id="drop" class="drop">
        <div class="corner a"></div><div class="corner b"></div>
        <div class="folder">📁</div>
        <strong>Drop .html atau .zip di sini</strong>
        <small>atau klik untuk pilih berkas</small>
        <div id="chosen"></div>
        <input id="file" type="file" accept=".html,.htm,.zip" hidden>
      </div>

      <button id="deployBtn" class="deploy" disabled>▶ &nbsp; JALANKAN DEPLOYMENT</button>

      <div class="output">
        <span>SYSTEM OUTPUT</span>
        <pre id="log">$ felixdeploy init
[--:--:--] ● Menunggu berkas...
$</pre>
      </div>
    </section>

    <section class="panel" id="projects">
      <div class="row"><div class="title"><i></i> PROJECT SAYA</div><button id="refresh">⟳ MUAT ULANG</button></div>
      <p>Riwayat deployment yang tersimpan di perangkat ini.</p>
      <div id="list"></div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script src="/script.js"></script>
</body>
</html>
